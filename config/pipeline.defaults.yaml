# AI Pipeline per-pipeline defaults
#
# This file is loaded from PIPELINE_DEFAULTS_FILE, defaulting to this path.
# It is safe by default: keep enabled: false until you want these defaults to
# affect real tasks.
#
# Merge rule:
# - Values under pipelines.<content_type>.params become default task params.
# - Explicit params in the task JSON always override this file.
# - Supported string placeholders: {data_dir}, {task_id}, {content_type}, {topic}
#
# Typical usage:
# 1. Adjust the paths below.
# 2. Set enabled: true.
# 3. Keep task JSON small; only override per-run values when needed.

enabled: false

pipelines:
  anime:
    params:
      # Anime normally writes to output/jobs/<task_id>/images and video.
      # Keep dry_run in task JSON, not here, unless you want every anime task dry-run.
      dry_run: true

  finance:
    params:
      # If omitted, FINANCE_MD_DIR / settings.finance_md_dir is used.
      source_dir: "G:\\Job\\Automation-Output\\sajin\\fund-daily"
      date: auto
      script_mode: 90_seconds
      strategy_profile: finance_conversion
      experiment_id: null
      script_writer: llm
      script_failure_policy: fail
      script_repair_attempts: 1
      title_writer: follow_script
      description_writer: follow_script
      metadata_failure_policy: fail
      metadata_repair_attempts: 1
      quality_gate: soft
      description: ""
      dry_run: true

  ai_briefing:
    params:
      # If omitted, AI_BRIEFING_DIR / settings.ai_briefing_dir is used.
      source_dir: "G:\\Hermes-Output\\每日AI简报"
      date: auto
      script_mode: 90_seconds
      strategy_profile: ai_reach
      experiment_id: null
      script_writer: llm
      script_failure_policy: fail
      script_repair_attempts: 1
      title_writer: follow_script
      description_writer: follow_script
      metadata_failure_policy: fail
      metadata_repair_attempts: 1
      quality_gate: soft
      description: ""
      handoff_wait_seconds: 0
      cover_size: story
      cover_template: ai-poster
      cover_title_position: center
      cover_background_scale: 1.0
      cover_background_position_x: 50.0
      cover_background_position_y: 50.0
      dry_run: true

  japanese:
    params:
      source_dir: "G:\\Job\\Photo-Datasets\\jap"
      output_dir: "{data_dir}\\japanese\\{task_id}"
      process_name: "日语视觉化"
      target_gem_url: "https://gemini.google.com/gem/f306c82a8105"
      image_prompt: ""

  ai_art:
    params:
      source_dir: "G:\\Job\\Photo-Datasets\\input"
      archive_dir: "G:\\Job\\Photo-Datasets\\done"
      failed_dir: "G:\\Job\\Photo-Datasets\\failed"
      process_name: "动漫图像比例更改"
      title: "AI绘画作品集"
      description: "AI图像处理作品集"
      tags: ["AI绘画", "作品集"]
      group_size: 4

  xhs_image_note:
    params:
      source_dir: "G:\\Job\\Photo-Datasets\\input"
      archive_dir: "G:\\Job\\Photo-Datasets\\done"
      failed_dir: "G:\\Job\\Photo-Datasets\\failed"
      process_name: "动漫图像比例更改"

  grouped_anime:
    params:
      source_dir: "G:\\Job\\Photo-Datasets\\input"
      archive_dir: "G:\\Job\\Photo-Datasets\\done"
      failed_dir: "G:\\Job\\Photo-Datasets\\failed"
      title: "分组动漫作品集"
      description: "相同前缀图片通过 MPT 自动生成的纯音乐动漫展示视频"
      tags: ["动漫", "AI视频", "作品集"]
      group_size: 4
      seconds_per_image: 5

