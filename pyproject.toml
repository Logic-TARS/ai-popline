[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project]
name = "ai-pipeline"
version = "0.1.0"
description = "AI content production pipeline orchestrating Gemini, MoneyPrinterTurbo, and social-auto-upload."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["automation", "content-pipeline", "social-media", "video"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "fastapi>=0.115.0",
    "av>=14.0.0",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
    "mcp>=1.12.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "httpx2>=0.28.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.12.0",
]

[project.scripts]
ai-pipeline = "content_pipeline.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["content_pipeline*"]

[tool.setuptools.package-data]
"content_pipeline.config" = ["*.yaml"]
"content_pipeline.web" = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_ai_briefing_pipeline.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "external: tests that call real external tools (Gemini, Photo-Process, MPT, SAU)",
    "smoke: end-to-end smoke tests requiring full environment",
    "publish: tests that actually publish to social platforms (disabled by default)",
]
addopts = "-m \"not publish\" --strict-markers"

[tool.coverage.run]
source = ["src/content_pipeline"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
